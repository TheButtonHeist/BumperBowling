included:
  - Sources
  - Tests
  - .bumper/Sources
  - .bumper/Tests

excluded:
  - .build
  - .bumper/.build
  - .swiftpm
  - DerivedData

disabled_rules:
  - cyclomatic_complexity
  - file_length
  - for_where
  - function_body_length
  - function_parameter_count
  - line_length
  - syntactic_sugar
  - trailing_comma
  - type_body_length

identifier_name:
  excluded: [id]

reporter: xcode
