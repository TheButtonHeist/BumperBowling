name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bumper-tests:
    name: Bumper Tests
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache SwiftPM builds
        uses: actions/cache@v4
        with:
          path: |
            .build
            .bumper/.build
          key: native-spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved', '.bumper/Package.swift', '.bumper/Package.resolved') }}
          restore-keys: |
            native-spm-${{ runner.os }}-${{ runner.arch }}-

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Run strict SwiftLint
        run: |
          if ! command -v swiftlint >/dev/null; then
            brew install swiftlint
          fi
          swiftlint lint --strict

      - name: Run package and runtime tests
        run: swift test

      - name: Run repository policy and recipe tests
        run: swift run bumper test .

      - name: Run repository self-lint
        run: swift run bumper lint .

      - name: Check starter, edits, build reuse, and distribution
        run: Scripts/verify-rule-journey.sh
